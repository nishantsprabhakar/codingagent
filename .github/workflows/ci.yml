name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      # Fails only on a NEW high/critical finding — the two known, currently-unfixable-upstream
      # advisories (image-size, no non-vulnerable release published yet) are allowlisted with
      # rationale in .audit-ci.json, not silently ignored.
      - run: npm run audit

  eval-smoke:
    name: eval CLI smoke test
    # The 12-task pilot corpus against a real provider costs real API quota/rate-limit budget on
    # every push, which CI shouldn't spend unattended — the harness's own unit tests (fixture
    # discovery, report scoring/aggregation, a fake-server smoke test of runOne()'s plumbing) are
    # already covered by the "verify" job above via src/eval/*.test.ts. This job is deliberately
    # just a build + a no-network invocation of the eval CLI entry point, catching a broken
    # `npm run eval` command without ever making a live model call from CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/eval/cli.js --help
